[project]
name = "ananta-multi-agent-engine"
version = "0.1.0"
description = "ANANTA Multi-Agent Production Engine - Local-first orchestration scaffold for episode production"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ANANTA Team"}
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "tenacity>=8.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# V1 legacy files intentionally preserved (Phase 1 interface + mock data).
# pipeline/providers.py must stay byte-identical: long mock strings, single-line
# exception, and legacy exception name are accepted as-is.
"pipeline/providers.py" = ["E501", "E701", "N818"]
# V1 CLI pipelines communicate to the terminal via print() by design.
"pipeline/episode_pipeline.py" = ["T201"]
"agents/base_agent.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"